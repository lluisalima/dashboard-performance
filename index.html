<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Presença — G24</title>
  <link rel="stylesheet" href="style.css">
  <script src="xlsx.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Controle de Presença — G24</h1>
      <p>Dashboard do coordenador para acompanhar presenças e desempenho por projeto.</p>
    </div>

    <div class="topbar-actions">
      <label class="date-control" title="Selecionar data salva">
        <span>📅</span>
        <input id="data-painel" type="date" onchange="trocarDia(this.value)">
      </label>
      <button class="button primary" onclick="baixarDia()">⇩ Baixar Diário</button>
      <button class="button muted" onclick="baixarMes()">▦ Relatório Mensal</button>
    </div>
  </header>

  <main class="page-shell">
    <section id="visao-geral" class="metric-grid" aria-label="Resumo do dia"></section>

    <section class="panel projects-panel">
      <div class="panel-header">
        <div>
          <h2>Projetos</h2>
          <p>Cada aba representa um grupo de funcionários. Marque o status do dia diretamente na tabela.</p>
          <p id="historico-info" class="history-hint"></p>
        </div>
        <div class="panel-actions">
          <button class="button outline" onclick="iniciarNovoDia()">＋ Inserir dados do dia</button>
          <button class="button outline" onclick="adicionarGrupo()">＋ Novo projeto</button>
          <button class="button outline" onclick="resetarDados()">↻ Restaurar</button>
        </div>
      </div>

      <nav id="abas-projetos" class="tabs" aria-label="Projetos cadastrados"></nav>
      <div id="grupos"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
